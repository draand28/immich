services:
  database:
    container_name: immich_test_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d immich"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    container_name: immich_test_redis
    image: docker.io/valkey/valkey:9
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  immich:
    container_name: immich_test_server
    image: immich-chunked:local
    environment:
      DB_HOSTNAME: database
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: redis
      IMMICH_MEDIA_LOCATION: /data
      IMMICH_MACHINE_LEARNING_URL: http://machine-learning:3003
      IMMICH_LOG_LEVEL: verbose
    volumes:
      - upload:/data
    ports:
      - "23283:2283"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

  machine-learning:
    container_name: immich_test_ml
    image: ghcr.io/immich-app/immich-machine-learning:release
    volumes:
      - model-cache:/cache

  # Stands in for Cloudflare: refuses any request body over 100 MB.
  proxy:
    container_name: immich_test_proxy
    image: docker.io/nginx:1.29-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "23284:80"
    depends_on:
      - immich

volumes:
  pgdata:
  upload:
  model-cache:
